name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.24"
  GOLANGCI_VERSION: "v2.1.6"

jobs:
  # The validation flow, in its canonical order:
  #   gofmt -> go vet -> go test -> golangci-lint -> go build
  # Each step is a separate action step so a failure names itself in the UI,
  # and the order matches scripts/check.sh exactly.
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 1. gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-formatted:"
            echo "$unformatted"
            echo "fix with: gofmt -w ."
            exit 1
          fi
          echo "all files formatted"

      - name: 2. go vet
        run: go vet ./...

      - name: 3. go test
        run: go test ./...

      - name: 4. golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ env.GOLANGCI_VERSION }}

      - name: 5. go build
        run: go build ./...

  # Gates that sit outside the flow because they need more than one runner or
  # an extra toolchain. They do not reorder the flow; they extend it.
  race:
    name: Race detector (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go test -race
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Report coverage
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func=coverage.txt | tail -1

  tidy:
    name: Module tidiness
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go mod tidy leaves no diff
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  cross-build:
    name: Cross build
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" ./cmd/claude-repo-factory

  vulnerabilities:
    name: Vulnerability scan
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
